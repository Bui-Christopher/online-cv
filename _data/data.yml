# I'm a software engineer with experience in Rust and Python, and I'm working to learn and grow in the development space. I've worked with Rust micro services, utilized gRPC/protocol buffers, and automated workflows with Python and bash scripts. <br><br>
# I've worked with microservices in rust and automated workflows with Python and bash scripts.
career-profile:
    title: Career Profile
    summary: |
      I'm a versatile backend/devops engineer with extensive experience within startup environments! Although I initially struggled in school and briefly dropped out of college, I persevered and proudly earned a
      degree in Computer Science from California State University, Fullerton. <br><br>

      My academic journey introduced me to C/C++ and sparked my interest in embedded systems and low level languages. This passion led me to Rust, where I've embraced its safety features and unique memory management.
      Currently, I'm focused on containerized microservices leveraging Docker, bash and Python for CI/CD automation. Additionally, these microservices are deployed using Helm and Kubernetes onto Amazon Web Services and Google Cloud Platform. <br><br>

      I'm also dedicated on honing my Linux skills through working with NixOS and Arch, while exploring personal projects in Rust. Continuously learning and sharing knowledge is my greatest passion and I find it refreshing and invigorating to dive into new challenges. <br><br>
